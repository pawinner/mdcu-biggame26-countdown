<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Game 2026 Countdown</title>
    <link rel="icon" type="image/png" href="assets/images/clockicon.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b0e;
            --field: #0f3b27;
            --field-line: rgba(255, 255, 255, 0.13);
            --gold: #f2b84b;
            --orange: #ff6b2a;
            --red: #e73535;
            --green: #23c468;
            --ink: #f6f4ec;
            --muted: rgba(246, 244, 236, 0.66);
            --panel: rgba(8, 11, 14, 0.72);
            --panel-border: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                linear-gradient(90deg, transparent 49.5%, rgba(255,255,255,0.32) 49.5%, rgba(255,255,255,0.32) 50.5%, transparent 50.5%),
                repeating-linear-gradient(90deg, var(--field-line) 0 2px, transparent 2px 11.11%),
                radial-gradient(circle at 50% 12%, rgba(242, 184, 75, 0.2), transparent 34%),
                linear-gradient(135deg, #081311 0%, var(--field) 46%, #111014 100%);
            color: var(--ink);
            transition: background-color 0.6s ease;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0;
        }

        body::before {
            z-index: 9997;
            background: rgba(35, 196, 104, 0.64);
        }

        body::after {
            z-index: 9996;
            background: rgba(231, 53, 53, 0.76);
        }

        body.correct-flash::before {
            animation: greenBlink 1.4s ease-in-out infinite;
        }

        body.timeout-flash::after {
            animation: redBlink 1.2s ease-in-out infinite;
        }

        body.penalty-flash {
            background-color: var(--red) !important;
        }

        body.secondary-correct-flash {
            background-color: var(--green) !important;
        }

        .shell {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(220px, 0.44fr) minmax(560px, 1.18fr);
            gap: clamp(16px, 2.4vw, 34px);
            align-items: center;
            width: min(1420px, calc(100vw - 32px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 0;
        }

        .event-lockup {
            display: grid;
            gap: 16px;
        }

        .status-strip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            padding: 9px 13px;
            border: 1px solid rgba(242, 184, 75, 0.42);
            border-radius: 999px;
            background: rgba(8, 11, 14, 0.45);
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .status-light {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 18px var(--green);
        }

        h1 {
            margin: 0;
            max-width: 9ch;
            color: #fff8e6;
            font-size: clamp(48px, 7.5vw, 96px);
            line-height: 0.84;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow:
                0 2px 0 rgba(0,0,0,0.5),
                0 0 36px rgba(242, 184, 75, 0.28);
        }

        .year {
            display: block;
            color: var(--gold);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 260px;
        }

        .score-cell {
            min-height: 64px;
            padding: 11px 13px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(8, 11, 14, 0.6);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .score-label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            margin-top: 8px;
            color: var(--ink);
            font-size: clamp(20px, 2.2vw, 28px);
            font-weight: 900;
            line-height: 1;
        }

        #unlocked-count {
            transform-origin: left center;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        #unlocked-count.highlight {
            color: var(--gold);
            text-shadow: 0 0 22px rgba(242, 184, 75, 0.72);
        }

        #unlocked-count.bump {
            animation: countBump 0.55s ease;
        }

        .timer-stage {
            position: relative;
            display: grid;
            gap: 14px;
            padding: clamp(14px, 1.8vw, 22px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: var(--panel);
            box-shadow:
                0 28px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            transition: filter 0.6s ease;
        }

        body.check-mode .timer-stage {
            filter: brightness(0.26) blur(4px);
        }

        .stage-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 38px;
        }

        .stage-title {
            margin: 0;
            color: var(--gold);
            font-size: clamp(18px, 2.4vw, 27px);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        #clock {
            flex: 0 0 auto;
            min-width: 118px;
            color: rgba(255, 255, 255, 0.82);
            font-variant-numeric: tabular-nums;
            font-size: clamp(18px, 2vw, 27px);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-align: right;
        }

        #player-container {
            aspect-ratio: 16 / 9;
            width: 100%;
            min-height: min(68vh, 690px);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0)),
                #050607;
            box-shadow: 0 18px 40px rgba(0,0,0,0.38);
        }

        #player,
        #player iframe {
            width: 100%;
            height: 100%;
        }

        .controls {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 10;
            display: none;
            gap: 10px;
        }

        button {
            min-height: 44px;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: var(--gold);
            color: #111;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        #penalty-overlay {
            position: fixed;
            top: clamp(18px, 3vw, 34px);
            left: clamp(18px, 3vw, 34px);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: clamp(20px, 4vw, 42px) clamp(24px, 5vw, 54px);
            border: 1px solid rgba(255, 177, 177, 0.56);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(255, 72, 72, 0.96), rgba(113, 8, 15, 0.94)),
                rgba(120, 0, 0, 0.92);
            box-shadow:
                0 24px 60px rgba(0,0,0,0.45),
                0 0 42px rgba(231, 53, 53, 0.46),
                inset 0 1px 0 rgba(255,255,255,0.24);
            color: white;
            font-size: clamp(46px, 8vw, 86px);
            font-weight: 1000;
            letter-spacing: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #penalty-overlay img {
            width: clamp(48px, 8vw, 88px);
            height: clamp(48px, 8vw, 88px);
        }

        #penalty-overlay.show {
            opacity: 1;
            transform: translateX(0);
        }

        #check-overlay,
        #win-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 30px;
            background:
                radial-gradient(circle at center, rgba(242,184,75,0.14), rgba(0,0,0,0.94) 56%),
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            text-align: center;
        }

        #win-overlay {
            z-index: 9999;
        }

        #check-overlay.show,
        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        #check-overlay h2,
        #win-overlay h2 {
            margin: 0;
            color: #ffffff;
            font-size: clamp(48px, 8vw, 96px);
            line-height: 0.9;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow:
                0 0 8px rgba(0,0,0,0.9),
                0 0 36px rgba(255,255,255,0.45),
                0 0 80px rgba(242,184,75,0.28);
            animation: pulseText 2s ease-in-out infinite;
        }

        #check-overlay .sub,
        #win-overlay .sub {
            color: rgba(255,255,255,0.78);
            font-size: clamp(22px, 2.8vw, 34px);
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 0.82; }
            50% { transform: scale(1.045); opacity: 1; }
        }

        @keyframes greenBlink {
            0% { opacity: 0; }
            30%, 60% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes redBlink {
            0% { opacity: 0; }
            30%, 60% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes countBump {
            0% { transform: scale(1); }
            36% { transform: scale(1.32); }
            100% { transform: scale(1); }
        }

        @media (max-width: 860px) {
            body {
                overflow: auto;
            }

            .shell {
                grid-template-columns: 1fr;
                align-content: center;
                width: min(100% - 28px, 680px);
            }

            h1 {
                max-width: 100%;
                font-size: clamp(56px, 18vw, 90px);
            }

            .scoreboard {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                max-width: 100%;
            }

            #player-container {
                min-height: 0;
            }
        }

        @media (max-width: 520px) {
            .stage-top,
            .scoreboard {
                grid-template-columns: 1fr;
            }

            .stage-top {
                display: grid;
                justify-items: start;
            }

            #clock {
                min-width: 0;
                text-align: left;
            }

            .scoreboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="shell" aria-label="Big Game 2026 countdown console">
        <section class="event-lockup">
            <div class="status-strip"><span class="status-light"></span> Live Timer</div>
            <h1>Big Game <span class="year">2026</span></h1>

            <div class="scoreboard" aria-label="Event scoreboard">
                <div class="score-cell">
                    <span class="score-label">Game</span>
                    <span class="score-value">Escape Box</span>
                </div>
                <div class="score-cell">
                    <span class="score-label">Round</span>
                    <span class="score-value">1</span>
                </div>
                <div class="score-cell">
                    <span class="score-label">จำนวนบ้านที่ปลดล็อกได้แล้ว</span>
                    <span class="score-value" id="unlocked-count">0</span>
                </div>
            </div>
        </section>

        <section class="timer-stage" aria-label="Timer player">
            <div class="stage-top">
                <p class="stage-title">Countdown</p>
                <div id="clock">00:00:00</div>
            </div>

            <div id="player-container">
                <div id="player"></div>
            </div>
        </section>
    </main>

    <div id="penalty-overlay">
        <img src="assets/images/clockicon.png" alt="">
        <span>-20%</span>
    </div>

    <div id="check-overlay">
        <h2>Take A Little Break</h2>
        <div class="sub">We will resume shortly<span id="break-dots">.</span></div>
    </div>

    <div id="win-overlay">
        <h2>Big Game Complete</h2>
        <div class="sub">Congratulations</div>
    </div>

    <div class="controls">
        <button id="playPauseBtn" onclick="togglePlay()">Play</button>
        <button id="penaltyBtn" onclick="applyPenalty()">-20% Penalty</button>
        <button id="correctBtn" onclick="applyCorrect()">Correct</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("clock").innerText = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        setInterval(checkTimeoutBlink, 500);
        updateClock();

        const videoId = "fXXlVs9f43I";
        const REVEAL_DELAY_MS = 1000;
        const TIMEOUT_TRIGGER_SEC = (45 * 60) + 6;

        let player;
        let isPlaying = false;
        let isCheckModeActive = false;
        let isWinModeActive = false;
        let hasStartedPlayback = false;
        let timeoutTriggered = false;
        let unlockedHouseCount = 0;
        let unlockedHighlightTimer;
        let breakDotsIndex = 0;
        let breakDotsTimer;

        const penaltySound = new Audio("https://www.myinstants.com/media/sounds/wrong-lie-incorrect-buzzer.mp3");
        penaltySound.volume = 0.35;
        penaltySound.preload = "auto";

        const penalty5Sound = new Audio("https://www.myinstants.com/media/sounds/campana.mp3");
        penalty5Sound.volume = 0.30;
        penalty5Sound.preload = "auto";

        const correctSound = new Audio("assets/sounds/WinSFX.mp3");
        correctSound.volume = 0.45;
        correctSound.preload = "auto";

        const correct2Sound = new Audio("https://www.myinstants.com/media/sounds/winner-bell-game-show-sound-effect.mp3");
        correct2Sound.volume = 0.5;
        correct2Sound.preload = "auto";

        const bellSound = new Audio("assets/sounds/phonering.mp3");
        bellSound.volume = 1.0;
        bellSound.preload = "auto";

        const comedyHitSound = new Audio("assets/sounds/ตลกตบมุก.mp3");
        comedyHitSound.volume = 0.7;
        comedyHitSound.preload = "auto";

        const getOutSound = new Audio("assets/sounds/getout.mp3");
        getOutSound.volume = 1.0;
        getOutSound.preload = "auto";

        const checkMusic = new Audio("assets/sounds/wwtbam64000q.mp3");
        checkMusic.loop = true;
        checkMusic.volume = 0.5;
        checkMusic.preload = "auto";

        function isPlayerReady() {
            return player
                && typeof player.getCurrentTime === "function"
                && typeof player.getDuration === "function"
                && typeof player.playVideo === "function"
                && typeof player.pauseVideo === "function";
        }

        function incrementUnlockedHouseCount() {
            unlockedHouseCount += 1;
            const count = document.getElementById("unlocked-count");
            count.innerText = String(unlockedHouseCount);
            count.classList.remove("bump");
            void count.offsetWidth;
            count.classList.add("bump", "highlight");

            clearTimeout(unlockedHighlightTimer);
            unlockedHighlightTimer = setTimeout(() => {
                count.classList.remove("highlight");
            }, 4000);
        }

        function startBreakDots() {
            const dots = document.getElementById("break-dots");
            if (!dots || breakDotsTimer) return;

            const states = [".", "..", "..."];
            dots.innerText = states[breakDotsIndex];
            breakDotsTimer = setInterval(() => {
                breakDotsIndex = (breakDotsIndex + 1) % states.length;
                dots.innerText = states[breakDotsIndex];
            }, 450);
        }

        function stopBreakDots() {
            if (!breakDotsTimer) return;

            clearInterval(breakDotsTimer);
            breakDotsTimer = undefined;
        }

        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName("script")[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player("player", {
                height: "480",
                width: "853",
                videoId,
                playerVars: {
                    playsinline: 1,
                    controls: 0,
                    disablekb: 1,
                    rel: 0
                },
                events: {
                    onStateChange: onPlayerStateChange
                }
            });
        }

        function showPenaltyOverlay(label = "-20%", duration = 4000) {
            const overlay = document.getElementById("penalty-overlay");
            if (!overlay) return;

            overlay.querySelector("span").innerText = label;
            overlay.classList.add("show");

            setTimeout(() => {
                overlay.classList.remove("show");
            }, duration);
        }

        function togglePlay() {
            if (!isPlayerReady()) return;

            if (isPlaying) {
                player.pauseVideo();
                enterCheckMode();
            } else {
                player.playVideo();
                exitCheckMode();
            }
        }

        function enterCheckMode() {
            if (isCheckModeActive || isWinModeActive || !hasStartedPlayback) return;

            isCheckModeActive = true;
            document.body.classList.add("check-mode");
            document.getElementById("check-overlay").classList.add("show");
            document.body.style.backgroundColor = "#000000";
            startBreakDots();

            checkMusic.currentTime = 0;
            checkMusic.play().catch(() => {});
        }

        function exitCheckMode() {
            if (!isCheckModeActive) return;

            isCheckModeActive = false;
            document.body.classList.remove("check-mode");
            document.getElementById("check-overlay").classList.remove("show");
            stopBreakDots();

            checkMusic.pause();
            checkMusic.currentTime = 0;
            document.body.style.backgroundColor = "#080b0e";
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById("playPauseBtn");

            if (event.data === YT.PlayerState.PLAYING) {
                hasStartedPlayback = true;
                isPlaying = true;
                btn.innerText = "Pause";
                exitCheckMode();
                return;
            }

            if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                btn.innerText = "Play";
                enterCheckMode();
            }
        }

        function applyPenalty() {
            if (!isPlayerReady()) return;

            const duration = player.getDuration();
            const currentTime = player.getCurrentTime();
            const timeLeft = duration - currentTime;
            if (timeLeft <= 0) return;

            const targetTime = currentTime + (timeLeft * 0.19);
            exitCheckMode();
            player.pauseVideo();

            setTimeout(() => {
                penaltySound.currentTime = 0;
                penaltySound.play().catch(() => {});
                showPenaltyOverlay("-20%", 4000);
                document.body.classList.add("penalty-flash");

                setTimeout(() => {
                    document.body.classList.remove("penalty-flash");
                }, 5000);

                setTimeout(() => {
                    player.seekTo(targetTime, true);
                    player.playVideo();
                }, 400);
            }, REVEAL_DELAY_MS);
        }

        function applyPenalty5() {
            incrementUnlockedHouseCount();
            if (!isPlayerReady()) return;

            const duration = player.getDuration();
            const currentTime = player.getCurrentTime();
            const timeLeft = duration - currentTime;
            if (timeLeft <= 0) return;

            const newTime = currentTime + (timeLeft * 0.04);
            penalty5Sound.currentTime = 0;
            penalty5Sound.play().catch(() => {});
            showPenaltyOverlay("-5%", 4000);
            document.body.classList.add("penalty-flash");

            setTimeout(() => {
                document.body.classList.remove("penalty-flash");
            }, 5000);

            player.seekTo(newTime, true);
            exitCheckMode();
            setTimeout(() => player.playVideo(), 50);
        }

        function applyCorrect() {
            exitCheckMode();

            setTimeout(() => {
                correctSound.currentTime = 0;
                correctSound.play().catch(() => {});
                document.body.classList.add("correct-flash");
                enterWinMode();
            }, REVEAL_DELAY_MS);
        }

        function enterWinMode() {
            isWinModeActive = true;
            exitCheckMode();
            document.body.classList.add("check-mode");
            document.getElementById("win-overlay").classList.add("show");

            if (isPlayerReady()) player.pauseVideo();
            checkMusic.pause();
            checkMusic.currentTime = 0;
        }

        function exitWinMode() {
            isWinModeActive = false;
            document.body.classList.remove("correct-flash");
            document.getElementById("win-overlay").classList.remove("show");
        }

        function checkTimeoutBlink() {
            if (!isPlayerReady() || timeoutTriggered) return;

            if (player.getCurrentTime() >= TIMEOUT_TRIGGER_SEC) {
                timeoutTriggered = true;
                document.body.classList.add("timeout-flash");
            }
        }

        document.addEventListener("keydown", function (event) {
            const tagName = document.activeElement.tagName.toLowerCase();
            if (tagName === "input" || tagName === "textarea") return;

            if (event.key.toLowerCase() === "p") {
                event.preventDefault();
                togglePlay();
            }

            if (event.shiftKey && event.key.toLowerCase() === "x") {
                event.preventDefault();
                applyPenalty();
            }

            if (event.shiftKey && event.key.toLowerCase() === "z") {
                event.preventDefault();
                applyPenalty5();
            }

            if (event.shiftKey && event.key.toLowerCase() === "c") {
                event.preventDefault();
                applyCorrect();
            }

            if (event.key.toLowerCase() === "h") {
                event.preventDefault();
                bellSound.currentTime = 0;
                bellSound.play().catch(() => {});
            }

            if (event.key === "5") {
                event.preventDefault();
                comedyHitSound.currentTime = 0;
                comedyHitSound.play().catch(() => {});
            }

            if (event.key === "6") {
                event.preventDefault();
                getOutSound.currentTime = 0;
                getOutSound.play().catch(() => {});
            }

            if (event.key === "9") {
                event.preventDefault();
                if (isPlayerReady()) player.seekTo((44 * 60) + 50, true);
            }

            if (event.key.toLowerCase() === "v") {
                event.preventDefault();
                exitCheckMode();
                if (isPlayerReady()) player.pauseVideo();

                setTimeout(() => {
                    correct2Sound.currentTime = 0;
                    correct2Sound.play().catch(() => {});
                    document.body.classList.add("secondary-correct-flash");

                    setTimeout(() => {
                        document.body.classList.remove("secondary-correct-flash");
                    }, 5000);

                    setTimeout(() => {
                        if (isPlayerReady()) player.playVideo();
                    }, 400);
                }, REVEAL_DELAY_MS);
            }

            if (event.key === "Escape") {
                event.preventDefault();
                exitWinMode();
                exitCheckMode();
                document.body.classList.remove("timeout-flash", "penalty-flash", "secondary-correct-flash");
            }
        });
    </script>
</body>
</html>
